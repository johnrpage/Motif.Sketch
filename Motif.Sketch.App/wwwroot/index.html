<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- The app has its own dark theme, so browsers mustn't darken it themselves (Chrome on Android's "dark theme for sites"). -->
    <meta name="color-scheme" content="light dark" />
    <title>Motif Sketch</title>
    <meta name="description" content="Sketch a system context diagram, turn it into a ports-and-adapters sketch, and export both, plus a solution plan." />
    <!-- Link previews (LinkedIn, Slack and others). The image comes from the Motif.NET brand folder and needs an absolute URL. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Motif.NET" />
    <meta property="og:title" content="Motif Sketch" />
    <meta property="og:description" content="Sketch a context diagram and a ports-and-adapters design, then export pictures and a solution plan for your coding agent. Runs in the browser, with no server and no accounts." />
    <meta property="og:url" content="https://motif-dotnet.github.io/Motif.Sketch/" />
    <meta property="og:image" content="https://motif-dotnet.github.io/Motif.Sketch/social-preview.png" />
    <meta property="og:image:width" content="1280" />
    <meta property="og:image:height" content="640" />
    <meta property="og:image:alt" content="Motif Sketch: sketch a context diagram and a ports-and-adapters design, then export pictures and a solution plan for your coding agent." />
    <meta name="twitter:card" content="summary_large_image" />
    <base href="/" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="preload" href="fonts/IBMPlexSans-Regular-Latin1.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="fonts/IBMPlexSans-SemiBold-Latin1.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" id="webassembly" />
    <link rel="stylesheet" href="css/motif.css" />
    <link rel="stylesheet" href="css/app.css" />
    <script>
        // Apply a remembered theme before the first paint, so dark-mode users don't see a flash.
        try {
            const t = localStorage.getItem("motif-theme");
            if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
        } catch { }
    </script>
    <script type="importmap"></script>
</head>

<body>
    <div id="app">
        <div class="splash">
            <svg class="mark" viewBox="0 0 24 24" aria-hidden="true"><rect x="2.9" y="15.74" width="5.36" height="5.36" rx="0.96" fill="none" stroke="currentColor" stroke-width="1.8"/><rect x="8.42" y="8.42" width="7.16" height="7.16" rx="1.86" fill="currentColor"/><rect x="14.84" y="2" width="7.16" height="7.16" rx="1.86" fill="var(--accent)"/></svg>
            <div class="word"><span class="motif">Motif</span> <b>Sketch</b></div>
            <div class="loading">Loading…</div>
            <noscript>Motif Sketch needs JavaScript and WebAssembly.</noscript>
        </div>
    </div>

    <div id="blazor-error-ui">
        Something went wrong. Your work is autosaved in this browser, so it's safe to reload.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">✕</span>
    </div>
    <script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>
</body>

</html>
